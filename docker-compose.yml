services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_refunds}
      POSTGRES_USER: ${POSTGRES_USER:-course_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_app_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-course_app} -d ${POSTGRES_DB:-course_refunds}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
